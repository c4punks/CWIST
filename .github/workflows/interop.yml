name: "Interop"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2spec:
    name: HTTP/2 conformance (h2spec, baseline diff)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Install h2spec
      run: |
        curl -sL -o /tmp/h2spec.tar.gz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
        sudo tar -xzf /tmp/h2spec.tar.gz -C /usr/local/bin h2spec
        h2spec --version

    - name: Run h2spec baseline gate
      run: scripts/ci/h2spec_gate.sh

  webtransport:
    name: WebTransport server end to end (aioquic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Install aioquic
      run: |
        python3 -m venv "$RUNNER_TEMP/wt"
        "$RUNNER_TEMP/wt/bin/pip" install aioquic==1.4.0

    - name: Echo session, stream, datagram, refusal and close
      run: make -j"$(nproc)" webtransport-e2e CWIST_WEBTRANSPORT=server PYTHON="$RUNNER_TEMP/wt/bin/python"

  http3-migration:
    name: HTTP/3 connection migration (aioquic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Install aioquic
      run: |
        python3 -m venv "$RUNNER_TEMP/h3-migration"
        "$RUNNER_TEMP/h3-migration/bin/pip" install aioquic==1.4.0

    - name: Test requests through 400 address changes
      run: make -j"$(nproc)" http3-migration-e2e CWIST_WEBRTC=0 PYTHON="$RUNNER_TEMP/h3-migration/bin/python"

  redis-rate-limit:
    name: Shared Redis rate limit (two processes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies and isolated Redis
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev redis-server

    - name: Test shared window, failures and bounded Redis calls
      run: |
        make -j"$(nproc)" SANITIZE=address,undefined WERROR=1 CWIST_HTTP3=0 CWIST_WEBRTC=0 redis-rate-limit-e2e test_redis_timeout test_redis_frame
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1
