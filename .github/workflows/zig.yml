name: "Zig bindings"

# bindings/zig: build and install CWIST, then translate its installed headers
# and link libcwist statically through cwist.pc, run the binding tests, and
# serve real requests with example/zig-hello. Linux and macOS, on one pinned
# Zig release (issue #36: Zig is pre-1.0, so a new release must never change
# what CI builds with until a PR moves the pin).

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0

jobs:
  zig:
    name: zig (${{ matrix.os }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_platform: x86_64-linux
            zig_sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          - os: macos-15
            zig_platform: aarch64-macos
            zig_sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config \
            libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config curl nghttp2 brotli zstd

      # The official release archive, checked against its published SHA-256,
      # so the pinned compiler cannot change underneath CI.
      - name: Install Zig ${{ env.ZIG_VERSION }}
        shell: bash
        run: |
          name="zig-${{ matrix.zig_platform }}-$ZIG_VERSION"
          curl -sSfL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz"
          echo "${{ matrix.zig_sha256 }}  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Build and install CWIST
        shell: bash
        env:
          # libttak's default stack adds -flto; AppleClang cannot emit fat LTO
          # objects, and plain objects are what the Zig linker consumes.
          PERF_STACK_FLAGS: ${{ runner.os == 'macOS' && '-O2 -g -pipe' || '' }}
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/curl/lib/pkgconfig' || '' }}
        run: |
          if [ -z "$PERF_STACK_FLAGS" ]; then unset PERF_STACK_FLAGS; fi
          jobs=$(getconf _NPROCESSORS_ONLN)
          make -j"$jobs"
          make install PREFIX="$RUNNER_TEMP/cwist"

      - name: zig build test
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/cwist/lib/pkgconfig"
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:/opt/homebrew/opt/curl/lib/pkgconfig"
          fi
          zig version
          pkg-config --cflags --libs --static cwist
          cd bindings/zig
          zig build test --summary all

      - name: example/zig-hello serves requests
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/cwist/lib/pkgconfig"
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:/opt/homebrew/opt/curl/lib/pkgconfig"
          fi
          (cd example/zig-hello && zig build)
          bash scripts/ci/hello_smoke.sh example/zig-hello/zig-out/bin/zig-hello "CWIST Zig"
