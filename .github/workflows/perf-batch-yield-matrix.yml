name: Perf — batch/yield matrix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/perf-batch-yield-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-yield-matrix:
    name: CWIST C1M batch/yield latency-throughput matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install dependencies & wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev wrk

      - name: Build CWIST and minimal server
        run: |
          make -j"$(nproc)"

          cat << 'EOF' > /tmp/cwist_server.c
          #include <cwist/app.h>
          #include <cwist/sys/app/app.h>
          #include <cwist/sys/app/endpoint_opts.h>
          static void handle_root(cwist_http_request *req, cwist_http_response *res) {
              (void)req;
              cwist_sstring_assign(res->body, "Hello, World!");
          }
          int main(void) {
              cwist_app *app = cwist_app_create();
              cwist_app_get_opt(app, "/", handle_root, CWIST_ENDPOINT_FIXED);
              cwist_app_listen(app, 9091);
              cwist_app_destroy(app);
              return 0;
          }
          EOF

          gcc -Ofast -flto=auto -fno-plt -falign-functions=32 -falign-loops=32 -falign-jumps=32 -falign-labels=32 -fno-semantic-interposition -fomit-frame-pointer -finline-functions -fipa-pta -I./include -I./lib -I./lib/libttak/include -o /tmp/cwist_server /tmp/cwist_server.c libcwist.a lib/cnats/build/lib/libnats_static.a lib/libttak/lib/libttak.a lib/cjson/libcjson.a lib/uriparser/build/liburiparser.a lib/lsquic/build/src/liblsquic/liblsquic.a lib/boringssl/build/libssl.a lib/boringssl/build/libcrypto.a -lcurl -lnghttp2 -lbrotlienc -lbrotlicommon -lbrotlidec -pthread -ldl -lm -lstdc++ -lz -lzstd

      - name: Run batch/yield matrix
        run: |
          run_cwist_c1m() {
            local batch="$1"
            local yield="$2"
            local tag="batch${batch}_yield${yield}"
            local out="/tmp/cwist_${tag}.txt"

            echo "=== batch=$batch yield=$yield ==="

            # Warmup + measured run managed by benchmark_session.py
            python3 scripts/ci/benchmark_session.py \
              --server "env CWIST_C1M_MODE=1 CWIST_HTTP_BATCH=$batch CWIST_HTTP_YIELD_BATCH=$yield /tmp/cwist_server" \
              -- bash scripts/ci/benchmark_workload.sh 9091 "$out" "/tmp/cwist_${tag}_stat.txt" 10 12 400

            # Parse the measured run summary emitted by benchmark_workload.sh
            echo "--- $tag ---"
            grep -E 'Requests/sec:|Latency\s+' "$out" | tail -5 || true
          }

          # Matrix: diagonal (batch == yield) plus yield sweep at batch=16
          run_cwist_c1m 1 1
          run_cwist_c1m 4 4
          run_cwist_c1m 8 8
          run_cwist_c1m 16 1
          run_cwist_c1m 16 4
          run_cwist_c1m 16 8
          run_cwist_c1m 16 16
          run_cwist_c1m 16 32
          run_cwist_c1m 16 64
          run_cwist_c1m 32 32
          run_cwist_c1m 64 64

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: batch-yield-matrix-logs
          path: /tmp/cwist_batch*_yield*.txt
