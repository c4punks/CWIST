name: BSD kqueue, tests, and benchmarks

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-report-tests:
    name: benchmark report rendering tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test benchmark report generation
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 tests/test_benchmark_session.py

  bsd-kqueue:
    name: kqueue tests (macOS)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install build dependencies
        run: brew install cmake pkg-config curl nghttp2 brotli
      - name: Verify kqueue backend and focused suite
        env:
          # AppleClang does not implement GCC's -ffat-lto-objects option.
          PERF_STACK_FLAGS: -O3 -march=native -mtune=native -pipe -flto -fomit-frame-pointer -funroll-loops -fstrict-aliasing -ffunction-sections -fdata-sections -fvisibility=hidden -DNDEBUG
          PKG_CONFIG_PATH: /opt/homebrew/opt/curl/lib/pkgconfig
        run: |
          make test_seq test_http_chunked test_mux test_test_client test_http_pipeline test_http_fairness
          make test_gc_job_handoff
          make -pn | grep -E '^IO_SRC[[:space:]]*=[[:space:]]*src/sys/io/kqueue\.c$'

  benchmark:
    name: benchmark (${{ matrix.os }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev
      - if: runner.os == 'macOS'
        run: brew install cmake pkg-config curl nghttp2 brotli
      - env:
          # AppleClang does not implement GCC's -ffat-lto-objects option.
          PERF_STACK_FLAGS: ${{ runner.os == 'macOS' && '-O3 -march=native -mtune=native -pipe -flto -fomit-frame-pointer -funroll-loops -fstrict-aliasing -ffunction-sections -fdata-sections -fvisibility=hidden -DNDEBUG' || '' }}
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && format('{0}/lib/pkgconfig', '/opt/homebrew/opt/curl') || '' }}
        run: python3 scripts/ci/benchmark.py measure > benchmark-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: benchmark-${{ runner.os }}.json

  web-server-benchmark:
    name: web server benchmark (CWIST vs Axum vs Spring vs Gin)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Set up Rust & Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install dependencies & wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev wrk maven
      - name: Generate inline web server code & run HTTP benchmark
        run: |
          # 1. CWIST Minimal HTTP Web Server
          cat << 'EOF' > /tmp/cwist_server.c
          #include <stdlib.h>
          #include <string.h>
          #include <cwist/app.h>
          #include <cwist/sys/app/app.h>
          #include <cwist/sys/app/endpoint_opts.h>
          static void handle_root(cwist_http_request *req, cwist_http_response *res) {
              (void)req;
              cwist_sstring_assign(res->body, "Hello, World!");
          }
          int main(void) {
              cwist_app *app = cwist_app_create();
              cwist_app_get_opt(app, "/", handle_root, CWIST_ENDPOINT_FIXED);
              cwist_app_listen(app, 9091);
              cwist_app_destroy(app);
              return 0;
          }
          EOF

          # 2. Axum Minimal HTTP Web Server
          mkdir -p /tmp/axum_bench && cd /tmp/axum_bench
          cat << 'EOF' > Cargo.toml
          [package]
          name = "axum_server"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          axum = "0.7"
          tokio = { version = "1.0", features = ["full"] }
          EOF
          mkdir -p src
          cat << 'EOF' > src/main.rs
          use axum::{routing::get, Router};

          fn main() {
              // Honor TOKIO_WORKER_THREADS so CI can size the runtime to its
              // pinned core set instead of oversubscribing all visible CPUs.
              let workers = std::env::var("TOKIO_WORKER_THREADS")
                  .ok()
                  .and_then(|v| v.parse::<usize>().ok())
                  .filter(|&n| n > 0)
                  .unwrap_or_else(|| std::thread::available_parallelism().map(|n| n.get()).unwrap_or(4));
              let rt = tokio::runtime::Builder::new_multi_thread()
                  .worker_threads(workers)
                  .enable_all()
                  .build()
                  .unwrap();
              rt.block_on(async {
                  let app = Router::new().route("/", get(|| async { "Hello, World!" }));
                  let listener = tokio::net::TcpListener::bind("127.0.0.1:9092").await.unwrap();
                  axum::serve(listener, app).await.unwrap();
              });
          }
          EOF

          # 3. Gin (Go) Minimal HTTP Web Server
          mkdir -p /tmp/gin_bench && cd /tmp/gin_bench
          cat << 'EOF' > go.mod
          module gin_server

          go 1.22

          require github.com/gin-gonic/gin v1.10.0
          EOF
          cat << 'EOF' > main.go
          package main

          import "github.com/gin-gonic/gin"

          func main() {
              gin.SetMode(gin.ReleaseMode)
              r := gin.New()
              r.GET("/", func(c *gin.Context) { c.String(200, "Hello, World!") })
              r.Run("127.0.0.1:9094")
          }
          EOF

          # 4. Spring Boot Minimal HTTP Web Server
          mkdir -p /tmp/spring_bench && cd /tmp/spring_bench
          cat << 'EOF' > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.example</groupId>
              <artifactId>spring-bench</artifactId>
              <version>0.0.1-SNAPSHOT</version>
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>3.2.3</version>
              </parent>
              <dependencies>
                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-webflux</artifactId>
                  </dependency>
                  <!-- Native epoll transport: lets Reactor Netty use epoll(7)
                       instead of NIO on Linux runners (fewer syscalls per
                       request, lower context-switch count). Version is managed
                       by the Spring Boot BOM. -->
                  <dependency>
                      <groupId>io.netty</groupId>
                      <artifactId>netty-transport-native-epoll</artifactId>
                      <classifier>linux-x86_64</classifier>
                      <scope>runtime</scope>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF
          # Spring WebFlux runs on the Reactor Netty event loop, and virtual
          # threads are disabled since the hello world handler is non-blocking,
          # avoiding unnecessary Loom career thread context-switching overhead.
          mkdir -p src/main/java/com/example src/main/resources
          cat << 'EOF' > src/main/resources/application.properties
          spring.threads.virtual.enabled=false
          EOF
          cat << 'EOF' > src/main/java/com/example/Application.java
          package com.example;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;

          @SpringBootApplication
          @RestController
          public class Application {
              @GetMapping("/")
              public String hello() { return "Hello, World!"; }

              public static void main(String[] args) {
                  SpringApplication.run(Application.class, args);
              }
          }
          EOF

          # Build servers
          cd $GITHUB_WORKSPACE
          make
          gcc -Ofast -flto=auto -fno-plt -falign-functions=32 -falign-loops=32 -falign-jumps=32 -falign-labels=32 -fno-semantic-interposition -fomit-frame-pointer -finline-functions -fipa-pta -I./include -I./lib -I./lib/libttak/include -o /tmp/cwist_server /tmp/cwist_server.c libcwist.a lib/cnats/build/lib/libnats_static.a lib/libttak/lib/libttak.a lib/cjson/libcjson.a lib/uriparser/build/liburiparser.a lib/lsquic/build/src/liblsquic/liblsquic.a lib/boringssl/build/libssl.a lib/boringssl/build/libcrypto.a -lcurl -lnghttp2 -lbrotlienc -lbrotlicommon -lbrotlidec -pthread -ldl -lm -lstdc++ -lz -lzstd

          cd /tmp/axum_bench && cargo build --release
          cd /tmp/gin_bench && go mod tidy && go build -o gin_server .
          # Maven Central occasionally returns 403 to shared CI egress IPs;
          # route through Google's GCS mirror of Central and enable retries.
          cd /tmp/spring_bench
          cat << 'EOF' > settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                  <mirror>
                      <id>gcs-central</id>
                      <name>Google Cloud Storage mirror of Maven Central</name>
                      <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                      <mirrorOf>central</mirrorOf>
                  </mirror>
              </mirrors>
          </settings>
          EOF
          mvn -q -s settings.xml -Dmaven.wagon.http.retryHandler.count=5 package -DskipTests

          # Full CPU budget for every measurement: servers and wrk both see all
          # runner cores. (Pinning to disjoint core sets was tried and capped
          # throughput at ~1/3 on small runners — the oversubscription jitter it
          # was meant to fix does not materialize on the CI VMs.)

          # Helper function for process stats before/after wrk test.
          # Every server gets an identical 10s warmup run (discarded) before the
          # measured run so JIT-tiered runtimes (JVM) reach steady state; context
          # switches are only counted over the measured window.
          run_bench() {
            NAME="$1"; CMD="$2"; PORT="$3"; TXT="$4"; STAT_TXT="$5"; WAIT="$6"
            THREADS="${7:-12}"; CONNECTIONS="${8:-400}"
            echo "=== Isolated $NAME (port $PORT) ==="
            python3 -c 'import socket,sys; s=socket.socket(); s.settimeout(.2); occupied=s.connect_ex(("127.0.0.1",int(sys.argv[1])))==0; s.close(); assert not occupied,"benchmark port already occupied"' "$PORT"
            python3 "$GITHUB_WORKSPACE/scripts/ci/benchmark_session.py" \
              --server "$CMD" --timeout "$((WAIT + 100))" --receipt "${TXT%.txt}.session.json" \
              -- python3 "$GITHUB_WORKSPACE/scripts/ci/benchmark_workload.py" \
              "$PORT" "$TXT" "$STAT_TXT" "$WAIT" "$THREADS" "$CONNECTIONS"
            python3 -c 'import socket,sys; s=socket.socket(); s.settimeout(.2); occupied=s.connect_ex(("127.0.0.1",int(sys.argv[1])))==0; s.close(); assert not occupied,"benchmark listener survived cleanup"' "$PORT"
            cat "$TXT"
          }

          # CWIST is measured twice: the classic thread-pool path (the
          # ultra-low-latency profile) and the event-driven C1M reactor path.
          run_bench "CWIST (classic)" "env CWIST_C1M_MODE=0 /tmp/cwist_server" 9091 "/tmp/cwist.txt" "/tmp/cwist_stat.txt" 10
          run_bench "CWIST C1M" "env CWIST_C1M_MODE=1 /tmp/cwist_server" 9091 "/tmp/cwist_c1m.txt" "/tmp/cwist_c1m_stat.txt" 10

          # CWIST_MALLOC_ARENA_MAX=1 caps glibc's per-process malloc arena
          # count to 1 before the fork loop (src/sys/app/app.c), inherited
          # by every worker. This is not an open experiment: PR #35 (merged)
          # already adopted it after mimalloc was tried and refuted on real
          # CI data (issue #25) -- eager per-process arena reservation is a
          # bad fit for CWIST's short-lived, low-allocation prefork workers.
          # This leg exists to keep confirming that decision on every run,
          # not to re-decide it. Same binary/config as "CWIST C1M" above;
          # the env var is the only variable, so this is a direct A/B, not a
          # new configuration.
          run_bench "CWIST C1M (arena_max=1)" "env CWIST_C1M_MODE=1 CWIST_MALLOC_ARENA_MAX=1 /tmp/cwist_server" 9091 "/tmp/cwist_c1m_arena1.txt" "/tmp/cwist_c1m_arena1_stat.txt" 10

          # CWIST_REACTOR_DRAIN_CHUNK=8: cooperative queuing for foreign-
          # thread posts (cwist_async_defer completions) within a big io_uring
          # CQE batch (issue #25, docs/cooperative-queuing.md). Same C1M
          # binary/config as "CWIST C1M" above, one env var changed - a
          # direct A/B, not a separate experimental configuration. Note:
          # this workload's handler never calls cwist_async_defer, so it
          # cannot exercise the path this knob affects; the leg is here to
          # confirm no regression on the plain request path under real CI
          # conditions, not to show the tail-latency win (that's measured
          # directly in tests/bench_cooperative_queuing.c, which isolates
          # the mechanism this workload can't reach).
          run_bench "CWIST C1M (drain_chunk=8)" "env CWIST_C1M_MODE=1 CWIST_REACTOR_DRAIN_CHUNK=8 /tmp/cwist_server" 9091 "/tmp/cwist_c1m_drainchunk.txt" "/tmp/cwist_c1m_drainchunk_stat.txt" 10

          # Tuned low-latency profile (CWIST classic only): lower connection
          # pressure (c100, 4 wrk threads) so the per-request latency floor is
          # visible alongside the c400 throughput numbers.
          run_bench "CWIST tuned" "env CWIST_C1M_MODE=0 /tmp/cwist_server" 9091 "/tmp/cwist_tuned.txt" "/tmp/cwist_tuned_stat.txt" 10 4 100
          export TUNED_PROFILE="wrk -t4 -c100 -d10s (after 10s warmup, warmup discarded)"
          run_bench "Axum" "/tmp/axum_bench/target/release/axum_server" 9092 "/tmp/axum.txt" "/tmp/axum_stat.txt" 10
          # Same -t4 -c100 profile as "CWIST tuned" above. The tuned section
          # used to report CWIST against Spring Boot only, which compares a
          # statically linked C server against a JVM one and says little about
          # CWIST's own latency floor. Axum is the closest peer in the matrix
          # (compiled, async, no managed runtime), so measure it at the tuned
          # profile too and report that pairing instead.
          run_bench "Axum tuned" "/tmp/axum_bench/target/release/axum_server" 9092 "/tmp/axum_tuned.txt" "/tmp/axum_tuned_stat.txt" 10 4 100
          run_bench "Gin" "/tmp/gin_bench/gin_server" 9094 "/tmp/gin.txt" "/tmp/gin_stat.txt" 10

          # Spring Boot JVM tuning (JDK 25):
          #  - Fixed 1024m heap + AlwaysPreTouch: no heap resize or page faults
          #    during the measured window.
          #  - G1GC + GCTimeRatio=99: G1 offers better tail-latency than
          #    ParallelGC for this workload size while still capping GC overhead
          #    to ~1% of wall time. The live set is tiny so G1 minor collections
          #    are equally sub-ms, and G1 avoids the stop-the-world full-GC risk
          #    that ParallelGC carries on small heaps under bursty load.
          #  - G1HeapRegionSize=1m: keeps region bookkeeping overhead minimal for
          #    a 1g heap (default would pick 1m anyway, but explicit is clearer).
          #  - JIT tiering: TieredStopAtLevel=4 (default Tier-4 C2) already
          #    active; CompileThreshold lowered to 1500 from default 10000 so
          #    the hot Netty/WebFlux paths reach native code faster during the
          #    10-second warmup window. CICompilerCount pinned to nproc to
          #    saturate all available compilation threads.
          #  - ioWorkerCount=$(nproc): Netty event-loop workers sized to the
          #    visible vCPU count (default would be 2x and inflate context
          #    switches on small runners).
          #  - Pooled Netty allocator with leak detection and buffer bounds/
          #    accessibility checks disabled: removes per-buffer overhead in
          #    the hot path.
          #  - Native epoll transport via netty-transport-native-epoll (see
          #    pom.xml above): replaces NIO Selector with epoll on Linux.
          #  - GC log written to /tmp/spring_gc.log and shipped with raw_logs
          #    so pauses can be audited after the run.
          #  - Dual JDK 25 AOT:
          #    (1) JEP 483 AOTClassLinking (-XX:+AOTClassLinking): links class
          #        hierarchy and vtable layout ahead of time so class loading is
          #        near-zero-cost at startup.
          #    (2) JEP 493 AOTCache (-XX:AOTCache): caches JIT-compiled native
          #        code from the training run and replays it at startup, skipping
          #        the entire interpretation + Tier-1/Tier-2 warm-up ramp.
          #    Both caches are produced during the training boot and consumed
          #    during the measured run.
          NPROC=$(nproc)
          SPRING_JVM_OPTS="-Xms1024m -Xmx1024m \
            -XX:+UseG1GC -XX:GCTimeRatio=99 -XX:G1HeapRegionSize=1m \
            -XX:+AlwaysPreTouch \
            -XX:CompileThreshold=1500 -XX:CICompilerCount=${NPROC} \
            -Djava.security.egd=file:/dev/urandom \
            -Djava.net.preferIPv4Stack=true \
            -Dio.netty.allocator.type=pooled \
            -Dio.netty.leakDetection.level=disabled \
            -Dio.netty.buffer.checkBounds=false \
            -Dio.netty.buffer.checkAccessible=false \
            -Dreactor.netty.ioWorkerCount=${NPROC} \
            -Xlog:gc*:file=/tmp/spring_gc.log:time,uptime,level,tags"
          SPRING_AOT_CACHE=/tmp/spring_bench/app.aot

          # Training run: produce Leyden AOT cache in a single boot.
          # -XX:+AOTClassLinking (JEP 483) links classes pre-boot.
          # -XX:AOTCacheOutput=<file> (JEP 514) writes the unified AOT cache (class data + JIT compiled code) on exit.
          java $SPRING_JVM_OPTS \
            -XX:+AOTClassLinking \
            -XX:AOTCacheOutput=$SPRING_AOT_CACHE \
            -jar /tmp/spring_bench/target/spring-bench-0.0.1-SNAPSHOT.jar --server.port=9093 &
          TRAIN_PID=$!
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:9093/ > /dev/null 2>&1 && break
            sleep 1
          done
          kill -TERM $TRAIN_PID 2>/dev/null || true
          wait $TRAIN_PID 2>/dev/null || true

          # Measured run: replay Leyden AOT cache.
          run_bench "Spring Boot" \
            "java $SPRING_JVM_OPTS \
              -XX:+AOTClassLinking \
              -XX:AOTCache=$SPRING_AOT_CACHE \
              -jar /tmp/spring_bench/target/spring-bench-0.0.1-SNAPSHOT.jar --server.port=9093" \
            9093 "/tmp/spring.txt" "/tmp/spring_stat.txt" 90

          # Tuned low-latency profile (wrk -t4 -c100), same reduced-concurrency
          # profile CWIST gets above. Previously only CWIST got a second,
          # lower-concurrency data point, so a report that showed "CWIST tuned
          # latency" next to "Spring latency" was comparing CWIST's best case
          # against Spring's only case -- not a fair fight. Give Spring Boot
          # the identical treatment: its own dedicated boot (replaying the
          # same trained AOT cache, so it isn't paying a second cold-start
          # penalty CWIST doesn't pay either) measured under -t4 -c100.
          run_bench "Spring Boot tuned" \
            "java $SPRING_JVM_OPTS -XX:+AOTClassLinking -XX:AOTCache=$SPRING_AOT_CACHE -jar /tmp/spring_bench/target/spring-bench-0.0.1-SNAPSHOT.jar --server.port=9093" \
            9093 "/tmp/spring_tuned.txt" "/tmp/spring_tuned_stat.txt" 90 4 100

          # Result JSON must land in the workspace so upload-artifact can find it
          # (the shell is still sitting in /tmp/spring_bench from the maven build).
          cd $GITHUB_WORKSPACE

          # Record exact toolchain/runtime facts alongside the numbers
          export RUNNER_HW="$(nproc) vCPU | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          export SPRING_JAVA_VERSION="$(java -version 2>&1 | head -1)"
          export SPRING_BOOT_VERSION="3.2.3"
          export SPRING_STACK="Spring WebFlux + Reactor Netty on native epoll (G1GC, JDK 25 Leyden AOT, virtual threads disabled)"
          export SPRING_JVM_OPTS_RECORDED="$SPRING_JVM_OPTS -XX:+AOTClassLinking -XX:AOTCache=$SPRING_AOT_CACHE (JEP 483 + JEP 514 single-step AOT)"
          export SPRING_VIRTUAL_THREADS="false"
          export GO_VERSION_RECORDED="$(go version)"
          export GIN_FRAMEWORK="Gin v1.10.0 (gin-gonic/gin, release mode)"
          export WRK_PROFILE="wrk -t12 -c400 -d10s (after 10s warmup, warmup discarded)"

          python3 scripts/ci/webserver_result.py --output webserver-result.json
      - name: Preserve raw and partial benchmark evidence
        if: always()
        run: |
          mkdir -p raw_logs
          for name in cwist cwist_c1m cwist_c1m_arena1 cwist_c1m_drainchunk cwist_tuned axum axum_tuned gin spring spring_tuned; do
            for suffix in .txt .warm.log _stat.txt .session.json; do
              file="/tmp/${name}${suffix}"
              if [ -f "$file" ]; then cp "$file" raw_logs/; fi
            done
          done
          if [ -f /tmp/spring_gc.log ]; then cp /tmp/spring_gc.log raw_logs/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webserver-result
          path: |
            webserver-result.json
            raw_logs/

  publish-benchmark-report:
    permissions:
      contents: write
    needs: [benchmark-report-tests, bsd-kqueue, benchmark, web-server-benchmark]
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download webserver-result
        uses: actions/download-artifact@v4
        with:
          name: webserver-result
          path: artifacts
      - name: Download benchmark-Linux
        uses: actions/download-artifact@v4
        with:
          name: benchmark-Linux
          path: artifacts
      - name: Download benchmark-macOS
        uses: actions/download-artifact@v4
        with:
          name: benchmark-macOS
          path: artifacts
      - name: Update benchmark history and English SVG report
        run: |
          mkdir -p benchmarks
          echo "=== Artifacts Directory Content ==="
          ls -laR artifacts || true
          echo "=== Current Directory Content ==="
          ls -la || true
          python3 - <<'PY'
          import glob, json
          from pathlib import Path
          path = Path('benchmarks/db.json')
          history = json.loads(path.read_text()) if path.exists() else []
          history.extend(json.load(open(f)) for f in glob.glob('artifacts/benchmark-*.json') + glob.glob('benchmark-*.json'))
          path.write_text(json.dumps(history[-100:], indent=2) + '\n')

          import os, sys
          sys.path.insert(0, 'scripts/ci')
          from webserver_result import append_history
          ws_path = Path('benchmarks/webserver.json')
          old = json.loads(ws_path.read_text()) if ws_path.exists() else []
          row = json.loads(Path('artifacts/webserver-result.json').read_text())
          updated = append_history(old, row, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_SHA'])
          ws_path.write_text(json.dumps(updated, indent=2) + '\n')
          PY
          python3 scripts/ci/benchmark.py render
      - name: Commit generated benchmark documentation
        run: |
          git config user.name "cwist-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every artifact benchmark.py render() writes. Keep this list in
          # sync with that function: a chart left out here is regenerated on
          # every run and then silently thrown away, which is what happened to
          # webserver-latency-distribution.svg on dev.
          generated="README README.md ROADMAP.md \
            benchmarks/db.json benchmarks/webserver.json \
            docs/benchmark-trends.svg \
            docs/webserver-benchmark-trends.svg \
            docs/webserver-latency-distribution.svg"
          missing=""
          for f in $generated; do [ -e "$f" ] || missing="$missing $f"; done
          if [ -n "$missing" ]; then
            echo "::error::render() did not produce:$missing"
            exit 1
          fi
          git add $generated
          git diff --cached --quiet || git commit -m "docs(ci): update benchmark report [skip ci]"
          git push
