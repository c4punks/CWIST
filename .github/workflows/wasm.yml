name: "WASM"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: Emscripten build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # lib/cjson (a WASM_SRCS member) is a submodule; the wasm archive does
    # not build without it.
    - name: Install Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 5.0.0
        actions-cache-folder: emsdk-cache

    # actions/cache restores the cached emsdk without the executable bit on
    # its bundled node, which makes `node wasm_smoke.js` fail with
    # "Permission denied" on cache hits. Fix the exact node on PATH and fall
    # back to the runner's system node if the bit cannot be restored.
    - name: Restore exec bit on cached emsdk node
      run: |
        NODE_BIN="$(command -v node || true)"
        echo "node on PATH: $NODE_BIN"
        [ -n "$NODE_BIN" ] && chmod +x "$NODE_BIN" || true
        ls -l "$NODE_BIN" || true

    # Phase 2 (issue #93): the JS wrapper is only proven if a consumer-style
    # module built through wasm_entry.h serves a request via the npm wrapper
    # with no Emscripten glue in the calling code. NODE is resolved the same
    # way as the smoke step above.
    - name: Build wrapper-test module and run it through the JS wrapper
      shell: bash
      run: |
        NODE_BIN="$(command -v node || true)"
        if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
          make wasm-wrapper-test NODE="$NODE_BIN"
        else
          make wasm-wrapper-test NODE="$(command -v nodejs || echo /usr/bin/node)"
        fi

    # Phase 2a done-when (issue #183): the packed tarball must install and
    # load in a clean directory, i.e. `npm install` replaces the from-source
    # flow. Pack, install into a temp dir outside the repo, load it there.
    # NODE is resolved the same way as the other steps: emsdk's node can be
    # restored from cache without its exec bit, so never call bare `node`.
    - name: Pack cwist-wasm and verify clean-directory install
      run: |
        NODE_BIN="$(command -v node || true)"
        if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
          make wasm-dist NODE="$NODE_BIN"
        else
          make wasm-dist NODE="$(command -v nodejs || echo /usr/bin/node)"
        fi
        TGZ="$(ls dist/cwist-wasm-*.tgz | head -1)"
        INSTALL_DIR="$(mktemp -d)"
        cd "$INSTALL_DIR"
        npm init -y >/dev/null
        npm install "$OLDPWD/$TGZ"
        node -e "const w = require('cwist-wasm'); \
          const r = w.parseResponseBytes(new TextEncoder().encode( \
            'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nok')); \
          if (r.status !== 200 || r.headers['Content-Type'] !== 'text/plain') process.exit(1); \
          console.log('clean-install verification passed');"

    # Phase 4 (issue #93): the end-to-end example app - routing + zod +
    # template + cwist_db + sessions behind a Service Worker host - must
    # build, and its WASM logic is covered by a node smoke that dispatches
    # through the cwist-wasm wrapper (the SW itself needs a browser).
    - name: Build WASM service-worker example and run node smoke
      shell: bash
      run: |
        make -j$(nproc) wasm
        example/wasm-service-worker/build.sh
        NODE_BIN="$(command -v node || true)"
        if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
          "$NODE_BIN" example/wasm-service-worker/smoke.js
        else
          "$(command -v nodejs || echo /usr/bin/node)" example/wasm-service-worker/smoke.js
        fi

    # wasm-smoke compiles and runs the smoke binary under node, so this is
    # build + run. Catches WASM-only regressions that native CI cannot see
    # (issue #93 gap 2) - e.g. clang-format corrupting EM_JS bodies.
    - name: Build libcwist_wasm.a and run smoke test
      shell: bash
      run: |
        emcc --version
        make -j$(nproc) wasm
        NODE_BIN="$(command -v node || true)"
        if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
          make wasm-smoke NODE="$NODE_BIN"
        else
          # emsdk node unusable (e.g. cache restored without exec bit): use
          # the runner's system node for the smoke run.
          make wasm-smoke NODE="$(command -v nodejs || echo /usr/bin/node)"
        fi

    # The EM_JS `=>` corruption this PR fixes recurs silently the next time
    # anyone runs `make format`. Guard exactly the files carrying EM_JS /
    # CWIST_WASM_INSTALL_VIEWS bodies with clang-format --dry-run --Werror:
    # scoped to those two files on purpose, because the tree-wide
    # `make format-check` compares against one pinned clang-format version
    # while runners ship different ones, and an unrelated grpc/protobuf.c
    # formatting drift would fail this job without touching WASM at all.
    - name: Verify clang-format guards (format-check)
      run: |
        clang-format --dry-run --Werror \
          tests/wasm_smoke.c include/cwist/wasm/typedarray.h \
          include/cwist/wasm/wasm_entry.h src/net/http/session.c src/sys/wasi/compat.c \
          example/wasm-service-worker/app.c

  # v3.7 Phase 1 (issue #201): the wasip2 socket server is only "supported"
  # if CI builds it and proves wasi:sockets serving on every push. Mirrors
  # the manual `make wasip2-smoke` gate; toolchain versions are pinned to
  # the ones docs/api/wasi.md was verified against.
  wasip2:
    name: WASI 0.2 socket server smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Extracted under ~/toolchains so the Makefile's WASI_SDK default
    # resolves with no env override.
    - name: Install wasi-sdk 25.0
      run: |
        mkdir -p "$HOME/toolchains"
        curl -sSL -o /tmp/wasi-sdk.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME/toolchains"

    - name: Install wasmtime 25
      run: |
        curl -sSL -o /tmp/wasmtime.tar.xz \
          https://github.com/bytecodealliance/wasmtime/releases/download/v25.0.0/wasmtime-v25.0.0-x86_64-linux.tar.xz
        tar -xJf /tmp/wasmtime.tar.xz -C /tmp
        echo "/tmp/wasmtime-v25.0.0-x86_64-linux" >> "$GITHUB_PATH"

    - name: Run wasip2 smoke (build + wasi:sockets curl probe)
      run: make wasip2-smoke

  # v3.7 Phase 1 (issue #203): the component pipeline is only "real" if CI
  # validates the WIT worlds and drives the jco-transpiled guests on every
  # push. Mirrors make wit-check / component-smoke / component-smoke-p3 /
  # component-browser-smoke / component-stream-smoke-p3; toolchain versions
  # match docs/api/wasm-component.md.
  component:
    name: Component pipeline (WIT + jco guests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Node >= 22 provides --experimental-wasm-jspi, which the 0.3 guests
    # need; the runner's default node is too old to rely on.
    - name: Install node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # Extracted under ~/toolchains so the Makefile's WASI_SDK default
    # resolves with no env override (wasip2 guests); 0.3 targets override
    # WASI_SDK to 34 explicitly below.
    - name: Install wasi-sdk 25.0
      run: |
        mkdir -p "$HOME/toolchains"
        curl -sSL -o /tmp/wasi-sdk.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME/toolchains"

    - name: Install wasi-sdk 34.0 (wasip3 sysroot)
      run: |
        curl -sSL -o /tmp/wasi-sdk-34.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wasi-sdk-34.tar.gz -C "$HOME/toolchains"

    - name: Install wasm-tools 1.259.0 and wit-bindgen 0.62.0
      run: |
        curl -sSL -o /tmp/wasm-tools.tar.gz \
          https://github.com/bytecodealliance/wasm-tools/releases/download/v1.259.0/wasm-tools-1.259.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
        curl -sSL -o /tmp/wit-bindgen.tar.gz \
          https://github.com/bytecodealliance/wit-bindgen/releases/download/v0.62.0/wit-bindgen-0.62.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wit-bindgen.tar.gz -C /tmp
        echo "/tmp/wasm-tools-1.259.0-x86_64-linux" >> "$GITHUB_PATH"
        echo "/tmp/wit-bindgen-0.62.0-x86_64-linux" >> "$GITHUB_PATH"

    - name: Validate WIT worlds (wit-check)
      run: make wit-check

    - name: Component smoke (0.2 guest over preview2-shim)
      run: make component-smoke NODE="$(command -v node)"

    - name: Component smoke 0.3 (wasip3 guest over preview3-shim + JSPI)
      run: |
        make component-smoke-p3 \
          WASI_SDK="$HOME/toolchains/wasi-sdk-34.0-x86_64-linux" \
          NODE="$(command -v node)"

    - name: Browser bundle gate (esbuild, no node-only imports)
      run: make component-browser-smoke NODE="$(command -v node)"

    - name: Streaming dispatch smoke (async host send-chunk)
      run: |
        make component-stream-smoke-p3 \
          WASI_SDK="$HOME/toolchains/wasi-sdk-34.0-x86_64-linux" \
          NODE="$(command -v node)"
