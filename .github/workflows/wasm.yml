name: "WASM"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: Emscripten build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # lib/cjson (a WASM_SRCS member) is a submodule; the wasm archive does
    # not build without it.
    - name: Install Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 5.0.0
        actions-cache-folder: emsdk-cache

    # actions/cache restores the cached emsdk without the executable bit on
    # its bundled node, which makes `node wasm_smoke.js` fail with
    # "Permission denied" on cache hits. Fix the exact node on PATH and fall
    # back to the runner's system node if the bit cannot be restored.
    - name: Restore exec bit on cached emsdk node
      run: |
        NODE_BIN="$(command -v node || true)"
        echo "node on PATH: $NODE_BIN"
        [ -n "$NODE_BIN" ] && chmod +x "$NODE_BIN" || true
        ls -l "$NODE_BIN" || true

    # Phase 2 (issue #93): the JS wrapper is only proven if a consumer-style
    # module built through wasm_entry.h serves a request via the npm wrapper
    # with no Emscripten glue in the calling code. NODE is resolved the same
    # way as the smoke step above.
    - name: Build wrapper-test module and run it through the JS wrapper
      shell: bash
      run: |
        NODE_BIN="$(command -v node || true)"
        if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
          make wasm-wrapper-test NODE="$NODE_BIN"
        else
          make wasm-wrapper-test NODE="$(command -v nodejs || echo /usr/bin/node)"
        fi

    # Phase 2a done-when (issue #183): the packed tarball must install and
    # load in a clean directory, i.e. `npm install` replaces the from-source
    # flow. Pack, install into a temp dir outside the repo, load it there.
    - name: Pack cwist-wasm and verify clean-directory install
      run: |
        make wasm-dist
        TGZ="$(ls dist/cwist-wasm-*.tgz | head -1)"
        INSTALL_DIR="$(mktemp -d)"
        cd "$INSTALL_DIR"
        npm init -y >/dev/null
        npm install "$OLDPWD/$TGZ"
        node -e "const w = require('cwist-wasm'); \
          const r = w.parseResponseBytes(new TextEncoder().encode( \
            'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nok')); \
          if (r.status !== 200 || r.headers['Content-Type'] !== 'text/plain') process.exit(1); \
          console.log('clean-install verification passed');"

    # wasm-smoke compiles and runs the smoke binary under node, so this is
    # build + run. Catches WASM-only regressions that native CI cannot see
    # (issue #93 gap 2) - e.g. clang-format corrupting EM_JS bodies.
    - name: Build libcwist_wasm.a and run smoke test
      shell: bash
      run: |
        emcc --version
        make -j$(nproc) wasm
        NODE_BIN="$(command -v node || true)"
        if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
          make wasm-smoke NODE="$NODE_BIN"
        else
          # emsdk node unusable (e.g. cache restored without exec bit): use
          # the runner's system node for the smoke run.
          make wasm-smoke NODE="$(command -v nodejs || echo /usr/bin/node)"
        fi

    # The EM_JS `=>` corruption this PR fixes recurs silently the next time
    # anyone runs `make format`. Guard exactly the files carrying EM_JS /
    # CWIST_WASM_INSTALL_VIEWS bodies with clang-format --dry-run --Werror:
    # scoped to those two files on purpose, because the tree-wide
    # `make format-check` compares against one pinned clang-format version
    # while runners ship different ones, and an unrelated grpc/protobuf.c
    # formatting drift would fail this job without touching WASM at all.
    - name: Verify clang-format guards (format-check)
      run: |
        clang-format --dry-run --Werror \
          tests/wasm_smoke.c include/cwist/wasm/typedarray.h
