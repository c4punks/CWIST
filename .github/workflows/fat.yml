name: "Fat archive"

# CWIST_FAT=1 folds the vendored static archives into libcwist.a and
# `make fat-dist` stages it with the headers the public API pulls in, so an
# embedded target needs only the bundle plus the app source at link time;
# CWIST_APP_FAT=1 links the example apps against that fat archive alone.
#
# Jobs:
#   fat          — bundle build + embedded-style link smoke, gcc and clang
#   fat-macos    — same on macOS, where the merge goes through libtool
#   fat-toggle   — flipping CWIST_FAT re-archives without recompiling objects
#   fat-examples — every example builds with CWIST_APP_FAT=1 and no vendored
#                  archive on its link line
#   fat-trim     — CWIST_TINY=1 / CWIST_DB=0 trimmed bundles drop the right
#                  members and still pass the link smoke

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fat:
    name: Fat archive build + embedded-style link smoke (${{ matrix.compiler }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Build the fat archive and embedded bundle
      run: make fat-dist -j"$(nproc)"

    - name: Verify vendored archives are folded in
      run: |
        # Members of every vendored archive must be present, not just the
        # CWIST objects: the archive alone has to satisfy an app link.
        ar t libcwist.a | grep -q '^cJSON\.o$'
        ar t libcwist.a | grep -q '^bio_ssl\.cc\.o$'
        ar t libcwist.a | grep -q '^lsqpack\.c\.o$'
        ar t libcwist.a | grep -q '^UriCommon\.c\.o$'
        nm --defined-only libcwist.a | grep -qw 'T SSL_new'
        nm --defined-only libcwist.a | grep -qw 'T lsquic_engine_new'
        nm --defined-only libcwist.a | grep -qw 'T natsConnection_Connect'
        nm --defined-only libcwist.a | grep -qw 'T sqlite3_open'

    - name: Embedded-style link smoke (bundle + app source only)
      run: |
        # Mirror the embedded workflow: copy just the fat-dist bundle and
        # the app source onto the target, link against system libs only.
        work=$(mktemp -d)
        cp -r dist/cwist-fat "$work/bundle"
        cp example/micro/01-hello/main.c "$work/"
        cd "$work"
        "${CC:-gcc}" -O2 -std=gnu17 -Ibundle/include -o hello main.c \
          bundle/lib/libcwist.a \
          $(pkg-config --libs libcurl libnghttp2 libbrotlienc libbrotlicommon libbrotlidec libzstd) \
          -pthread -ldl -lm -lstdc++ -lz
        ./hello &
        pid=$!
        sleep 2
        test "$(curl -s -m 3 http://127.0.0.1:8080/)" = "Hello, CWIST!"
        kill "$pid"

    - name: CWIST_APP_FAT example build
      run: |
        # The app link must reference libcwist.a and no vendored archive.
        out=$(make CWIST_APP_FAT=1 example/micro/01-hello/hello 2>&1 | tail -1)
        echo "$out"
        echo "$out" | grep -q 'libcwist\.a'
        ! echo "$out" | grep -q 'lib/[a-z0-9_/-]*/[^ ]*\.a'
        ./example/micro/01-hello/hello &
        pid=$!
        sleep 2
        test "$(curl -s -m 3 http://127.0.0.1:8080/)" = "Hello, CWIST!"
        kill "$pid"

  fat-macos:
    name: Fat archive on macOS (libtool merge)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: brew install cmake pkg-config curl nghttp2 brotli zstd

    - name: Build the fat archive and embedded bundle
      run: |
        # Homebrew curl is keg-only; expose its .pc so the Makefile's
        # pkg-config probes see it.
        export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        make fat-dist -j"$(sysctl -n hw.ncpu)"

    - name: Verify vendored archives are folded in
      run: |
        # Darwin merges via libtool, not the GNU ar MRI script; the result
        # must still be the complete archive. Mach-O symbols carry a
        # leading underscore.
        ar t libcwist.a | grep -q '^cJSON\.o$'
        ar t libcwist.a | grep -q '^bio_ssl\.cc\.o$'
        ar t libcwist.a | grep -q '^lsqpack\.c\.o$'
        ar t libcwist.a | grep -q '^UriCommon\.c\.o$'
        nm libcwist.a | grep -q 'T _SSL_new'
        nm libcwist.a | grep -q 'T _lsquic_engine_new'
        nm libcwist.a | grep -q 'T _natsConnection_Connect'
        nm libcwist.a | grep -q 'T _sqlite3_open'

    - name: Embedded-style link smoke (bundle + app source only)
      run: |
        export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        work=$(mktemp -d)
        cp -r dist/cwist-fat "$work/bundle"
        cp example/micro/01-hello/main.c "$work/"
        cd "$work"
        cc -O2 -std=gnu17 -Ibundle/include -o hello main.c \
          bundle/lib/libcwist.a \
          $(pkg-config --libs libcurl libnghttp2 libbrotlienc libbrotlicommon libbrotlidec libzstd) \
          -pthread -lm -lc++ -lz
        ./hello &
        pid=$!
        sleep 2
        test "$(curl -s -m 3 http://127.0.0.1:8080/)" = "Hello, CWIST!"
        kill "$pid"

  fat-toggle:
    name: Thin/fat toggle re-archives without recompiling
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Flip thin -> fat -> thin -> CWIST_APP_FAT
      run: |
        set -e
        # Plain build: no vendored members in the archive.
        make libcwist.a -j"$(nproc)" > /tmp/thin1.log 2>&1
        ! ar t libcwist.a | grep -q '^cJSON\.o$'

        # fat-dist forces the fat archive and stages the bundle.
        make fat-dist -j"$(nproc)" > /tmp/fat.log 2>&1
        ar t libcwist.a | grep -q '^cJSON\.o$'
        test -f dist/cwist-fat/lib/libcwist.a
        test -d dist/cwist-fat/include/cwist
        test -f dist/cwist-fat/include/cjson/cJSON.h
        test -d dist/cwist-fat/include/openssl
        test -d dist/cwist-fat/include/ttak
        test -f dist/cwist-fat/include/sqlite3.h

        # Every later flip must only re-archive: a compile line ('-c -o')
        # in the log means the .build-fat stamp rebuilt objects.
        make libcwist.a > /tmp/thin2.log 2>&1
        ! ar t libcwist.a | grep -q '^cJSON\.o$'
        ! grep -q -- '-c -o' /tmp/thin2.log

        # CWIST_APP_FAT=1 implies CWIST_FAT=1 for the library itself.
        make CWIST_APP_FAT=1 libcwist.a > /tmp/appfat.log 2>&1
        ar t libcwist.a | grep -q '^cJSON\.o$'
        ! grep -q -- '-c -o' /tmp/appfat.log

  fat-examples:
    name: Example apps link against the fat archive alone
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Build every example with CWIST_APP_FAT=1
      run: |
        set -o pipefail
        make CWIST_APP_FAT=1 examples micro-examples -j"$(nproc)" 2>&1 | tee /tmp/examples.log

    - name: Verify no link line carries a vendored archive
      run: |
        # Every example must link libcwist.a plus system -l flags only; a
        # lib/<vendor>/....a path on a link line means APP_LIBS leaked.
        links=$(grep -E '(^|/)(gcc|clang|cc) .*-o ' /tmp/examples.log | grep 'libcwist\.a')
        count=$(printf '%s\n' "$links" | wc -l)
        echo "$count example link lines"
        test "$count" -ge 20
        ! printf '%s\n' "$links" | grep -q 'lib/[a-z0-9_/-]*/[^ ]*\.a'

  # Compile-time feature trimming (CWIST_TINY / CWIST_DB and friends): the
  # dropped subsystems must leave no objects in the fat archive, the kept
  # core must still satisfy the same embedded-style link smoke as the full
  # build, and the sizes go on record for comparison.
  # Pluggable TLS backend (issue #430): CWIST_TLS=mbedtls swaps BoringSSL for
  # the vendored mbedTLS 3.6 LTS behind the internal seam in
  # src/security/tls/.  The fat archive must contain zero BoringSSL objects or
  # symbols, and an HTTPS app linked against the bundle alone must answer a
  # TLS request.  CWIST_HTTP3 stays explicitly 0 (lsquic needs BoringSSL's
  # QUIC API; the Makefile would force it off anyway).
  fat-mbedtls:
    name: Fat archive with the mbedTLS TLS backend (CWIST_TLS=mbedtls)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Build the fat archive and embedded bundle (CWIST_TLS=mbedtls)
      run: make CWIST_TLS=mbedtls CWIST_HTTP3=0 fat-dist -j"$(nproc)"

    - name: Verify no BoringSSL objects or symbols, mbedTLS folded in
      run: |
        ! ar t libcwist.a | grep -q '^bio_ssl\.cc\.o$'
        ! nm --defined-only libcwist.a 2>/dev/null | grep -qw 'T SSL_new'
        ar t libcwist.a | grep -q '^ssl_tls\.c\.o$'
        nm --defined-only libcwist.a | grep -qw 'T mbedtls_ssl_handshake'
        # The bundle stages the seam shim as include/openssl plus the real
        # mbedTLS headers, instead of BoringSSL's openssl tree.
        test -f dist/cwist-fat/include/openssl/ssl.h
        grep -q 'CWIST_SHIM_OPENSSL_SSL_H' dist/cwist-fat/include/openssl/ssl.h
        test -d dist/cwist-fat/include/mbedtls
        test -d dist/cwist-fat/include/psa

    - name: HTTPS smoke against the bundle (curl -k)
      run: |
        # Embedded-style: only the bundle, the app source and system libs.
        # openssl CLI generates the throwaway cert; the linked TLS library is
        # mbedTLS, not BoringSSL (asserted above).
        work=$(mktemp -d)
        cp -r dist/cwist-fat "$work/bundle"
        cp example/micro/18-https-hello/main.c "$work/"
        cd "$work"
        openssl req -x509 -newkey rsa:2048 -nodes -keyout server.key -out server.crt \
          -days 1 -subj "/CN=127.0.0.1" 2>/dev/null
        "${CC:-gcc}" -O2 -std=gnu17 -Ibundle/include -o https-hello main.c \
          bundle/lib/libcwist.a \
          $(pkg-config --libs libcurl libnghttp2 libbrotlienc libbrotlicommon libbrotlidec libzstd) \
          -pthread -ldl -lm -lz
        ./https-hello &
        pid=$!
        trap 'kill $pid 2>/dev/null || true' EXIT
        body=
        for i in $(seq 1 20); do
          body=$(curl -sk -m 2 https://127.0.0.1:8443/) && break
          sleep 0.3
        done
        test "$body" = "Hello, CWIST!"
        kill "$pid"

    - name: Run the TLS-adjacent test subset under CWIST_TLS=mbedtls
      run: |
        make CWIST_TLS=mbedtls CWIST_HTTP3=0 -j"$(nproc)" \
          test_https test_https_park test_https_pool_queue test_https_metrics \
          test_http2 test_http2_prebuffer test_jwt test_middleware_jwt \
          test_session test_seq_auth test_sha256

    - name: Record archive sizes
      run: |
        ls -l libcwist.a dist/cwist-fat/lib/libcwist.a
        size libcwist.a 2>/dev/null || true

  fat-trim:
    name: Trimmed fat archive (${{ matrix.cfg }})
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cfg: ["CWIST_TINY=1", "CWIST_DB=0"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev

    - name: Build the trimmed fat archive and embedded bundle
      run: make ${{ matrix.cfg }} fat-dist -j"$(nproc)"

    - name: Verify dropped members are gone and kept members stay
      run: |
        if [ "${{ matrix.cfg }}" = "CWIST_TINY=1" ]; then
          # HTTP/3 off: no lsquic objects; DB off: no sqlite; NATS off: no
          # libnats symbols (its member names carry no 'nats' substring).
          ! ar t libcwist.a | grep -q '^lsqpack\.c\.o$'
          ! ar t libcwist.a | grep -q '^sqlite3\.o$'
          ! nm --defined-only libcwist.a 2>/dev/null | grep -qw 'T natsConnection_Connect'
        else
          # CWIST_DB=0: sqlite is out, HTTP/3 (lsquic) stays in.
          ! ar t libcwist.a | grep -q '^sqlite3\.o$'
          ar t libcwist.a | grep -q '^lsqpack\.c\.o$'
        fi
        # Always kept: cJSON and BoringSSL (HTTPS and sessions need it).
        ar t libcwist.a | grep -q '^cJSON\.o$'
        nm --defined-only libcwist.a 2>/dev/null | grep -qw 'T SSL_new'

    - name: Embedded-style link smoke (bundle + app source only)
      run: |
        # Same smoke as the full-feature fat job: only the bundle, the app
        # source, and system libraries participate in the link.
        work=$(mktemp -d)
        cp -r dist/cwist-fat "$work/bundle"
        cp example/micro/01-hello/main.c "$work/"
        cd "$work"
        "${CC:-gcc}" -O2 -std=gnu17 -Ibundle/include -o hello main.c \
          bundle/lib/libcwist.a \
          $(pkg-config --libs libcurl libnghttp2 libbrotlienc libbrotlicommon libbrotlidec libzstd) \
          -pthread -ldl -lm -lstdc++ -lz
        ./hello &
        pid=$!
        sleep 2
        test "$(curl -s -m 3 http://127.0.0.1:8080/)" = "Hello, CWIST!"
        kill "$pid"

    - name: Record archive sizes
      run: |
        ls -l libcwist.a dist/cwist-fat/lib/libcwist.a
        size libcwist.a 2>/dev/null || true
