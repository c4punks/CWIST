name: "Release assets"

# When a GitHub release is published, build the distributable targets that CI
# already verifies (fat-dist bundles per platform and TLS backend, the
# amalgamation, the cwist-wasm npm package) from the release tag, smoke-test
# each one, and attach them to the release with a SHA256SUMS file.
#
# The source tarball (cwist-<version>.tar.gz from `make dist`) is uploaded by
# the maintainer and pinned by the Homebrew formula; this workflow never
# replaces it.  Assets are uploaded only after every build has passed, so a
# release never carries a partial set.  Re-running for an existing tag
# (workflow_dispatch) replaces the assets this workflow owns.
#
# Linux assets are built on ubuntu-22.04 so the archives do not reference
# glibc 2.38+ symbols (__isoc23_*) and link on older distributions too.  All
# bundles are built with CWIST_PORTABLE=1 (no -march=native).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build assets for, e.g. v4'
        required: true

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  fat:
    name: fat-dist (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            make: ""
          - name: linux-x86_64-mbedtls
            os: ubuntu-22.04
            make: "CWIST_TLS=mbedtls CWIST_HTTP3=0"
          - name: linux-aarch64
            os: ubuntu-22.04
            make: "CROSS_COMPILE=aarch64-linux-gnu- PKG_CONFIG=pkg-config"
            triplet: aarch64-linux-gnu
            deb_arch: arm64
            qemu_arch: aarch64
          - name: macos-arm64
            os: macos-15
            make: ""
    steps:
    - name: Checkout the release tag
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        submodules: recursive

    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux' && !matrix.triplet
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config curl \
          libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev zlib1g-dev

    - name: Install cross toolchain and target libraries (Linux cross)
      if: matrix.triplet
      run: |
        # The runner mirrors carry amd64 only; the target architecture comes
        # from ports.ubuntu.com.
        sudo dpkg --add-architecture ${{ matrix.deb_arch }}
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
        else
          sudo sed -i -E 's/^deb (https?:)/deb [arch=amd64] \1/; s/^deb \[/deb [arch=amd64 /; s/\[arch=amd64 arch=amd64\]/[arch=amd64]/' \
            /etc/apt/sources.list
        fi
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        sudo tee /etc/apt/sources.list.d/ports.sources >/dev/null <<EOF
        Types: deb
        URIs: http://ports.ubuntu.com/ubuntu-ports
        Suites: $codename $codename-updates $codename-security
        Components: main universe
        Architectures: ${{ matrix.deb_arch }}
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config qemu-user curl \
          gcc-${{ matrix.triplet }} g++-${{ matrix.triplet }} \
          libcurl4-openssl-dev:${{ matrix.deb_arch }} \
          libnghttp2-dev:${{ matrix.deb_arch }} \
          libbrotli-dev:${{ matrix.deb_arch }} \
          libzstd-dev:${{ matrix.deb_arch }} \
          zlib1g-dev:${{ matrix.deb_arch }}
        echo "PKG_CONFIG_LIBDIR=/usr/lib/${{ matrix.triplet }}/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake pkg-config curl nghttp2 brotli zstd
        # Homebrew curl is keg-only; expose its .pc to the Makefile probes.
        echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig" >> "$GITHUB_ENV"

    - name: Build the bundle
      run: |
        jobs=$(getconf _NPROCESSORS_ONLN)
        make CWIST_PORTABLE=1 ${{ matrix.make }} VERSION="${TAG#v}" fat-dist -j"$jobs"

    - name: Smoke-test the bundle
      run: |
        if [ -n "${{ matrix.triplet }}" ]; then
          export CC=${{ matrix.triplet }}-gcc
          export RUN="qemu-${{ matrix.qemu_arch }} -L /usr/${{ matrix.triplet }}"
        fi
        ./scripts/ci/bundle_smoke.sh dist/cwist-fat

    - name: Package
      run: |
        name="cwist-${TAG#v}-fat-${{ matrix.name }}"
        mkdir -p out
        mv dist/cwist-fat "dist/$name"
        tar czf "out/$name.tar.gz" -C dist "$name"
        ls -l out

    - uses: actions/upload-artifact@v4
      with:
        name: asset-fat-${{ matrix.name }}
        path: out/*
        if-no-files-found: error

  amalgamation:
    name: amalgamation (${{ matrix.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            cfg: ""
          - name: linux-tiny
            cfg: "CWIST_TINY=1"
    steps:
    - name: Checkout the release tag
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config curl \
          libcurl4-openssl-dev libnghttp2-dev libbrotli-dev libzstd-dev zlib1g-dev

    - name: Generate the amalgamation
      run: make CWIST_PORTABLE=1 ${{ matrix.cfg }} VERSION="${TAG#v}" amalgamation fat-dist -j"$(nproc)"

    - name: Compile cwist.c standalone and run the hello smoke
      run: |
        # The drop-in contract: one -I plus the file; the vendored code links
        # from the fat archive of the same configuration.
        gcc -O2 -std=gnu17 -Idist/amalgamation/include -pthread \
          -c dist/amalgamation/cwist.c -o "$RUNNER_TEMP/cwist.o"
        APP_OBJS="$RUNNER_TEMP/cwist.o" ./scripts/ci/bundle_smoke.sh dist/cwist-fat

    - name: Package
      run: |
        name="cwist-${TAG#v}-amalgamation-${{ matrix.name }}"
        mkdir -p out
        mv dist/amalgamation "dist/$name"
        tar czf "out/$name.tar.gz" -C dist "$name"
        ls -l out

    - uses: actions/upload-artifact@v4
      with:
        name: asset-amalgamation-${{ matrix.name }}
        path: out/*
        if-no-files-found: error

  wasm:
    name: cwist-wasm npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout the release tag
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        submodules: recursive

    - name: Install node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install wasi-sdk 25.0
      run: |
        mkdir -p "$HOME/toolchains"
        curl -sSL -o /tmp/wasi-sdk.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME/toolchains"

    - name: Install wasm-tools 1.259.0 and wit-bindgen 0.62.0
      run: |
        curl -sSL -o /tmp/wasm-tools.tar.gz \
          https://github.com/bytecodealliance/wasm-tools/releases/download/v1.259.0/wasm-tools-1.259.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
        curl -sSL -o /tmp/wit-bindgen.tar.gz \
          https://github.com/bytecodealliance/wit-bindgen/releases/download/v0.62.0/wit-bindgen-0.62.0-x86_64-linux.tar.gz
        tar -xzf /tmp/wit-bindgen.tar.gz -C /tmp
        echo "/tmp/wasm-tools-1.259.0-x86_64-linux" >> "$GITHUB_PATH"
        echo "/tmp/wit-bindgen-0.62.0-x86_64-linux" >> "$GITHUB_PATH"

    - name: Pack cwist-wasm and verify clean-directory install
      run: |
        make wasm-dist VERSION="${TAG#v}" NODE="$(command -v node)"
        tgz=$(ls dist/cwist-wasm-*.tgz)
        install_dir=$(mktemp -d)
        (cd "$install_dir" && npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE/$tgz")
        (cd "$install_dir" && node -e "const w = require('cwist-wasm'); \
          const r = w.parseResponseBytes(new TextEncoder().encode( \
            'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nok')); \
          if (r.status !== 200) process.exit(1);")
        mkdir -p out
        cp "$tgz" out/

    - uses: actions/upload-artifact@v4
      with:
        name: asset-wasm
        path: out/*
        if-no-files-found: error

  upload:
    name: Attach assets to the release
    needs: [fat, amalgamation, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: asset-*
        path: assets
        merge-multiple: true

    - name: Checksums
      run: |
        cd assets
        sha256sum -- * > "cwist-${TAG#v}-assets-SHA256SUMS"
        cat "cwist-${TAG#v}-assets-SHA256SUMS"

    - name: Upload to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
