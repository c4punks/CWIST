[package]
name = "cwist-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Raw FFI bindings to libcwist, the CWIST C web framework"
license = "MIT"
repository = "https://github.com/c4punks/CWIST"
readme = "README.md"
links = "cwist"
keywords = ["cwist", "ffi", "bindings", "web-framework", "http"]
categories = ["external-ffi-bindings", "network-programming", "web-programming"]

[build-dependencies]
bindgen = "0.70"
pkg-config = "0.3"
